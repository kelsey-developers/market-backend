services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: market_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql://market_user:market_pass@db:3306/market
      PORT: 4000
      NODE_ENV: production
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-4000}:4000"
    volumes:
      - uploads_data:/app/uploads

  db:
    image: mysql:8.4
    container_name: market_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_DATABASE: market
      MYSQL_USER: market_user
      MYSQL_PASSWORD: market_pass
    ports:
      - "3308:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "market_user", "-pmarket_pass"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
  uploads_data:
